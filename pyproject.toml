[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atp-private"
dynamic = ["version"]
description = "ATP private package: engine / method code (private; never copied to the public ATP repository)"
requires-python = ">=3.13"
# No runtime dependencies on purpose: on the host the package is only put on PYTHONPATH (no pip install), so any
# third-party library the engine needs must already be in ATP's backend image (see README, "Dependencies").
dependencies = []

[project.optional-dependencies]
# The copied Trade tests also need these (Trade's pins). They are NOT in ATP's backend image today, so they are test-only
# here; whether the image gets them is decided with the provider port (M79 W5). The rest comes from ATP's
# backend/requirements.txt at ATP_VERSION (the CI job installs it first).
test = ["pytest>=8", "matplotlib~=3.11", "plotly~=7.0", "pyyaml~=6.0", "requests~=2.33"]

[tool.setuptools.dynamic]
version = { attr = "atp_private.__version__" }

[tool.setuptools.packages.find]
include = ["atp_private*"]

[tool.pytest.ini_options]
testpaths = ["tests", "atp_private/trade_engine/tests"]
